<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>扭蛋抽獎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <section class="view">
    <div class="page-head">
      <div>
        <div class="eyebrow">Gacha</div>
        <h1 id="title">扭蛋抽獎</h1>
      </div>
      <button type="button" class="sound-btn" id="sound-btn" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6" hidden/></svg>
        <span id="sound-label">音效開</span>
      </button>
    </div>
    <div class="draw-grid">
      <div class="stage">
        <div class="machine">
          <div class="crown" aria-hidden="true"></div>
          <div class="dome" id="dome"><canvas id="dome-canvas" aria-hidden="true"></canvas></div>
          <div class="collar" aria-hidden="true"></div>
          <div class="body">
            <div class="price-plate"><span>剩餘扭蛋</span><span><b id="left-count">0</b> 顆</span></div>
            <div class="chute"><span class="cap-out" id="cap-out" hidden><span class="capsule" id="cap-out-capsule"><span class="top"></span><span class="bot"></span></span></span></div>
            <div class="knob-wrap">
              <button type="button" class="knob" id="knob" aria-label="轉動旋鈕扭一顆"></button>
              <span class="knob-label">轉一下</span>
            </div>
          </div>
        </div>
        <div class="under">
          <div class="hint" id="hint" aria-live="polite">載入中…</div>
          <p class="msg" id="draw-msg"></p>
        </div>
      </div>
      <div class="side">
        <div class="panel">
          <div class="panel-head"><h2>扭蛋裡有什麼</h2><span class="mode-note" id="kinds-count"></span></div>
          <ul class="showcase" id="showcase"></ul>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- 開扭蛋動畫 -->
<div class="reveal" id="reveal" hidden role="dialog" aria-modal="true" aria-label="開扭蛋">
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="reveal-stage">
    <div class="rays" aria-hidden="true"></div>
    <div class="big-cap" id="big-cap" role="button" tabindex="0" aria-label="打開扭蛋"><span class="capsule"><span class="top"></span><span class="bot"></span></span></div>
    <div class="tap-hint">點一下打開！</div>
    <div class="prize-pop" id="prize-pop">
      <div class="prize-pic" id="prize-pic"></div>
      <div class="prize-label">
        <span class="prize-kicker">恭喜獲得</span>
        <span class="prize-name" id="prize-name"></span>
        <span class="prize-sub" id="prize-sub"></span>
      </div>
      <button type="button" class="btn-primary" id="reveal-close">收下獎品</button>
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/front.js"></script>
</body>
</html>
