<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>扭蛋抽獎｜後台設定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <section class="view">
    <div class="page-head">
      <div>
        <div class="eyebrow" id="admin-eyebrow">Admin</div>
        <h1>後台設定</h1>
      </div>
      <a class="link-btn" href="index.html" target="_blank" rel="noopener">開啟前台扭蛋機 →</a>
    </div>

    <div class="panel"><div class="summary" id="summary"></div></div>

    <div class="panel">
      <h2>活動名稱</h2>
      <form class="row" id="title-form">
        <div class="field"><label for="title-input">顯示在前台上方</label><input type="text" id="title-input" maxlength="60"></div>
        <button type="submit">儲存</button>
      </form>
    </div>

    <div class="panel">
      <h2>新增獎品</h2>
      <form class="row" id="add-form">
        <div class="field tight"><label for="add-color">扭蛋顏色</label><input type="color" id="add-color" value="#E8483C"></div>
        <div class="field"><label for="add-name">獎品名稱</label><input type="text" id="add-name" maxlength="60" placeholder="例如：頭獎 iPad" required></div>
        <div class="field qty"><label for="add-qty">數量</label><input type="number" id="add-qty" min="1" max="99999" value="1" required></div>
        <div class="field tight"><span>獎品圖片（選填）</span>
          <label class="file-pick"><input type="file" id="add-file" accept="image/*"><img class="pv" id="add-pv" alt="" hidden><span id="add-file-name">選擇圖片</span></label>
        </div>
        <button type="submit" class="btn-primary" id="add-btn">新增</button>
      </form>
      <p class="msg" id="add-msg"></p>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>獎品清單</h2>
        <div class="actions"><button type="button" class="btn-danger" id="reset-btn">剩餘數量重設為原始數量</button></div>
      </div>
      <p class="mode-note">「剩餘」是扭蛋機裡還有的數量，每扭出一顆自動減 1；「原始」是重設時要回復的數量。顏色、名稱、數量改完離開欄位就會自動儲存，已開啟的前台會立即更新。</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>顏色</th><th>圖片</th><th>獎品名稱</th><th>剩餘</th><th>原始</th><th>狀態</th><th></th></tr></thead>
          <tbody id="prize-rows"></tbody>
        </table>
      </div>
      <p class="msg" id="table-msg"></p>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>得獎紀錄</h2>
        <button type="button" class="btn-danger" id="clear-btn">清除全部紀錄</button>
      </div>
      <ul class="log" id="log-admin"></ul>
    </div>

    <div class="panel">
      <h2>備份與搬移</h2>
      <p class="mode-note">資料存在這台電腦的瀏覽器裡。換電腦或換瀏覽器前，先匯出備份檔，再到新的地方匯入。</p>
      <div class="backup-row">
        <button type="button" id="export-btn">匯出備份檔</button>
        <label class="btn">匯入備份檔<input type="file" id="import-file" accept="application/json,.json"></label>
      </div>
      <p class="msg" id="backup-msg"></p>
    </div>
  </section>
</div>

<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
